<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <script>document.documentElement.classList.add('js')</script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f3ec" />
    <!-- ci: auto-deployed from github.com/Abdulmalik-rf/artzone (artzone-press) -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!-- prerendered content in the first viewport shows immediately (no wait
         for the JS bundle); only content further down animates in on scroll -->
    <script>(function(){var h=innerHeight;document.querySelectorAll('[data-reveal]').forEach(function(e){var r=e.getBoundingClientRect();if(r.top<h&&r.bottom>0)e.classList.add('is-in')})})()</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
